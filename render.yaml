services:
  - type: web
    name: multi-brain-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: CUSTOM_API_KEY
        sync: false
      - key: CUSTOM_API_BASE_URL
        sync: false
      - key: CUSTOM_API_MODEL
        sync: false
